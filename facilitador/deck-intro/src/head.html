<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LAFISE · Procesamiento de eventos en tiempo real · Introducción</title>
  <style>
/* ──────────────────────────────────────────────────────────────────────────
   FONTS — self-hosted DM Sans + DM Mono
   ────────────────────────────────────────────────────────────────────────── */
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-regular.ttf')        format('truetype'); font-weight:400; font-style:normal;  font-display:swap; }
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-italic.ttf')         format('truetype'); font-weight:400; font-style:italic;  font-display:swap; }
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-medium.ttf')         format('truetype'); font-weight:500; font-style:normal;  font-display:swap; }
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-medium-italic.ttf')  format('truetype'); font-weight:500; font-style:italic;  font-display:swap; }
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-bold.ttf')           format('truetype'); font-weight:700; font-style:normal;  font-display:swap; }
@font-face { font-family:'DM Sans'; src:url('fonts/dm-sans-bold-italic.ttf')    format('truetype'); font-weight:700; font-style:italic;  font-display:swap; }
@font-face { font-family:'DM Mono'; src:url('fonts/dm-mono-regular.ttf')        format('truetype'); font-weight:400; font-style:normal;  font-display:swap; }
@font-face { font-family:'DM Mono'; src:url('fonts/dm-mono-italic.ttf')         format('truetype'); font-weight:400; font-style:italic;  font-display:swap; }
@font-face { font-family:'DM Mono'; src:url('fonts/dm-mono-medium.ttf')         format('truetype'); font-weight:500; font-style:normal;  font-display:swap; }

/* ──────────────────────────────────────────────────────────────────────────
   TOKENS
   ────────────────────────────────────────────────────────────────────────── */
:root {
  /* Brand */
  --lava:        #FF3621;
  --lava-600:    #E5301D;
  --lava-700:    #B8281B;
  --lava-100:    #FFE0DA;
  --lava-50:     #FFF3F0;

  --navy:        #1B3139;
  --navy-900:    #0B2026;
  --navy-700:    #2F4A52;
  --navy-600:    #425A62;
  --navy-500:    #5B7079;
  --navy-300:    #97A3A6;
  --navy-200:    #BFC5C7;

  --oat-light:   #F9F7F4;
  --oat-medium:  #EEEDE9;
  --oat-dark:    #DCD9D3;

  /* Extended */
  --maroon:      #3E1414;
  --maroon-deep: #250B0B;
  --maroon-hi:   #6A2120;

  --mint:        #00A972;
  --azure:       #2272B4;
  --amber:       #F5B400;
  --violet:      #7C3AED;

  /* Type stacks */
  --font-display:'DM Sans','Inter',system-ui,sans-serif;
  --font-sans:   'DM Sans',system-ui,sans-serif;
  --font-mono:   'DM Mono',ui-monospace,'SF Mono',Menlo,monospace;

  /* Type scale (1920×1080 native, but every size clamped to be safe) */
  --t-mega:    180px;
  --t-display: 132px;
  --t-h1:      84px;
  --t-h2:      60px;
  --t-h3:      36px;
  --t-lede:    28px;
  --t-body:    21px;
  --t-sm:      16px;
  --t-xs:      13px;

  /* Spacing */
  --margin:    96px;
  --margin-l:  128px;
  --gutter:    24px;

  --footer-h:  56px;

  /* Motion */
  --ease:      cubic-bezier(0.22, 1, 0.36, 1);
}

/* ──────────────────────────────────────────────────────────────────────────
   BASE
   ────────────────────────────────────────────────────────────────────────── */
html, body {
  margin: 0;
  background: #000;
  height: 100%;
  font-family: var(--font-display);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Slide base — every <section> gets these */
.slide {
  position: absolute;
  inset: 0;
  background: var(--oat-light);
  color: var(--navy-900);
  overflow: hidden;
  display: grid;
  grid-template-rows: 1fr auto;
  font-family: var(--font-display);
}
.slide.dark      { background: var(--navy-900); color: #F2F5F3; }
.slide.lava      { background: var(--lava);     color: #FFFFFF; }
.slide.maroon    { background: var(--maroon);   color: #F2EAE8; }
.slide.paper     { background: #FFFFFF;          color: var(--navy-900); }
.slide.oat-deep  { background: var(--oat-medium); color: var(--navy-900); }

/* Body region */
.body {
  padding: 88px var(--margin) 32px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  isolation: isolate;
}

/* ──────────────────────────────────────────────────────────────────────────
   SHARED CHROME
   Eyebrow, footer, runner, marks. Every content slide should use these.
   ────────────────────────────────────────────────────────────────────────── */

/* Eyebrow — small uppercase tag with leading rule */
.eyebrow {
  font-family: var(--font-sans);
  font-size: 22px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  display: inline-flex; align-items: center; gap: 14px;
  margin-bottom: 28px;
}
.eyebrow::before {
  content: ""; width: 36px; height: 1.5px; background: var(--lava);
}
.dark   .eyebrow,
.maroon .eyebrow { color: #FFB8AD; }
.dark   .eyebrow::before,
.maroon .eyebrow::before { background: #FFB8AD; }
.lava   .eyebrow { color: #2A0B05; }
.lava   .eyebrow::before { background: #2A0B05; }

/* Slide footer — runs across the bottom of every slide */
.footer {
  height: var(--footer-h);
  padding: 0 var(--margin);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  font-family: var(--font-mono);
  font-size: 14px; letter-spacing: 0.04em;
  color: var(--navy-500);
  border-top: 1px solid var(--oat-medium);
}
.dark   .footer { color: var(--navy-300); border-top-color: var(--navy-700); }
.maroon .footer { color: #C9A8A0; border-top-color: #5C2120; }
.lava   .footer { color: #FFD9D0; border-top-color: rgba(255,255,255,0.18); }
.footer .l { text-align: left;  }
.footer .c { text-align: center; }
.footer .r { text-align: right; }
.footer .l b {
  font-family: var(--font-sans); font-weight: 500;
  color: var(--navy-900); letter-spacing: 0;
  text-transform: uppercase; font-size: 14px;
  letter-spacing: 0.16em;
  margin-right: 14px;
}
.dark   .footer .l b { color: #F2F5F3; }
.maroon .footer .l b { color: #F2EAE8; }
.lava   .footer .l b { color: #FFFFFF; }
.footer .num { color: var(--lava); font-weight: 500; }
.lava .footer .num { color: #FFFFFF; }

/* Sectionheader / slide-title */
.slide-title {
  font-family: var(--font-display);
  font-size: var(--t-h1);
  line-height: 1.02;
  letter-spacing: -0.028em;
  font-weight: 500;
  margin: 0 0 24px;
  color: inherit;
  text-wrap: pretty;
}
.slide-title em {
  font-style: italic;
  color: var(--lava);
  font-weight: 500;
}
.dark .slide-title em, .maroon .slide-title em, .lava .slide-title em {
  color: #FFFFFF;
}

.lede {
  font-family: var(--font-display);
  font-size: var(--t-lede);
  line-height: 1.45;
  color: var(--navy-700);
  max-width: 1280px;
  margin: 0 0 40px;
  font-weight: 400;
  text-wrap: pretty;
}
.dark .lede   { color: #B8C5C0; }
.maroon .lede { color: #D7C2BD; }
.lava   .lede { color: #FFE0DA; }

/* Tiny utility — mono label */
.tag {
  font-family: var(--font-mono);
  font-size: 14px; letter-spacing: 0.06em;
  color: var(--navy-500); text-transform: uppercase;
}
.dark   .tag { color: var(--navy-300); }
.maroon .tag { color: #C9A8A0; }
.lava   .tag { color: #FFD9D0; }

/* Inline emphasis */
.lava-text { color: var(--lava); }
.dark .lava-text, .maroon .lava-text { color: #FF8A75; }

/* Hairline */
hr.rule {
  border: 0; height: 1px; background: var(--oat-dark);
  margin: 0;
}
.dark   hr.rule { background: var(--navy-700); }
.maroon hr.rule { background: var(--maroon-hi); }
.lava   hr.rule { background: rgba(255,255,255,0.24); }

/* Brand mark (lockup) — small, top-left */
.lockup { height: 28px; display: inline-flex; align-items: center; }
.lockup img { height: 100%; display: block; }

/* Hex pattern tile (re-used) */
.hex-bg {
  background-image: url('assets/hexagon_pattern.svg');
  background-repeat: repeat;
  background-size: 240px 208px;
}

/* Overflow guardrails — any direct child of .body that wraps text gets a min-height: 0 fix */
.body > * { min-width: 0; }
.body > * { min-height: 0; }

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — cover-editorial
   ────────────────────────────────────────────────────────────────────────── */
.p-cover .body {
  padding: 80px var(--margin-l) 32px;
  display: grid;
  grid-template-columns: 88px 1fr 240px;
  grid-template-rows: auto 1fr auto;
  gap: 48px 56px;
}
.p-cover .cv-rail {
  grid-column: 1; grid-row: 1 / 4;
  border-right: 1px solid var(--oat-dark);
  padding-right: 24px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.p-cover .cv-rail .vt {
  writing-mode: vertical-rl;
  font-family: var(--font-mono);
  font-size: 14px; letter-spacing: 0.32em; text-transform: uppercase;
  color: var(--navy-500);
  transform: rotate(180deg);
}
.p-cover .cv-issue {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--navy-500);
}
.p-cover .cv-top {
  grid-column: 2 / 4; grid-row: 1;
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 24px;
}
.p-cover .cv-top .lockup img { height: 32px; }
.p-cover .cv-top .cv-stamp {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-700);
  text-align: right; line-height: 1.5;
}
.p-cover .cv-top .cv-stamp b {
  display: block; color: var(--lava); font-weight: 500;
}
.p-cover .cv-headline {
  grid-column: 2; grid-row: 2;
  align-self: end;
}
.p-cover .cv-headline .kicker {
  font-family: var(--font-sans);
  font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  margin-bottom: 28px;
  display: inline-flex; align-items: center; gap: 16px;
}
.p-cover .cv-headline .kicker::before {
  content: ""; width: 48px; height: 2px; background: var(--lava);
}
.p-cover .cv-headline h1 {
  font-family: var(--font-display);
  font-size: var(--t-mega);
  line-height: 0.88;
  letter-spacing: -0.045em;
  font-weight: 500;
  margin: 0;
  color: var(--navy-900);
  text-wrap: balance;
}
.p-cover .cv-headline h1 .e {
  font-style: italic;
  color: var(--lava);
}
.p-cover .cv-subhead {
  grid-column: 2; grid-row: 3;
  align-self: end;
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 56px;
  padding-top: 36px;
  border-top: 1px solid var(--oat-dark);
}
.p-cover .cv-subhead .deck {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: 1.35;
  color: var(--navy-700);
  font-weight: 400;
  text-wrap: pretty;
}
.p-cover .cv-subhead .meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px 32px;
  align-self: end;
}
.p-cover .cv-subhead .meta dt {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); font-weight: 500;
  margin-bottom: 6px;
}
.p-cover .cv-subhead .meta dd {
  margin: 0; font-family: var(--font-display);
  font-size: 21px; color: var(--navy-900);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
/* Lava symbol — bled off canvas right */
.p-cover .cv-mark {
  grid-column: 3; grid-row: 2;
  align-self: end; justify-self: end;
  position: relative;
}
.p-cover .cv-mark img {
  width: 380px; height: 380px;
  display: block;
  transform: translate(80px, 40px) rotate(8deg);
  opacity: 0.92;
}

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — index-numbered
   ────────────────────────────────────────────────────────────────────────── */
.p-index .body { padding: 88px var(--margin) 32px; }
.p-index .ix-head {
  display: grid; grid-template-columns: 1fr auto; align-items: end;
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1.5px solid var(--navy-900);
}
.p-index .ix-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 64px;
  line-height: 0.95;
  letter-spacing: -0.03em;
  font-weight: 500;
}
.p-index .ix-head h2 em {
  font-style: italic; color: var(--lava); font-weight: 500;
}
.p-index .ix-head .meta {
  font-family: var(--font-mono); font-size: 21px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); text-align: right; line-height: 1.5;
}
.p-index .ix-rows {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0 56px;
  flex: 1; min-height: 0;
}
.p-index .ix-section {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  padding: 10px 0 7px;
  border-bottom: 1px solid var(--oat-dark);
  display: flex; justify-content: space-between;
}
.p-index .ix-section span:last-child {
  color: var(--navy-500);
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
}
.p-index .ix-row {
  display: grid;
  grid-template-columns: 50px 1fr auto;
  align-items: baseline;
  gap: 18px;
  padding: 2px 0;
  border-bottom: 1px solid var(--oat-medium);
}
.p-index .ix-row:last-of-type { border-bottom: 0; }
.p-index .ix-num {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-500);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.08em;
}
.p-index .ix-title {
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--navy-900);
  line-height: 1.16;
}
.p-index .ix-title .sub {
  display: block;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 400;
  color: var(--navy-500);
  margin-top: 1px;
  letter-spacing: 0;
}
.p-index .ix-pg {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-500);
  font-variant-numeric: tabular-nums;
}
.p-index .ix-section {
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  padding: 6px 0 5px;
  border-bottom: 1px solid var(--oat-dark);
  display: flex; justify-content: space-between;
}
.p-index .ix-row.now .ix-num,
.p-index .ix-row.now .ix-title,
.p-index .ix-row.now .ix-pg { color: var(--lava); }
.p-index .ix-row.now .ix-title { font-weight: 500; }
.p-index .ix-row.now .ix-num::after {
  content: "▸";
  margin-left: 6px;
  color: var(--lava);
}

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — section-lava-flood
   ────────────────────────────────────────────────────────────────────────── */
.p-section-lava .body {
  padding: 80px var(--margin-l);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 32px;
}
.p-section-lava .sl-top {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
}
.p-section-lava .sl-part {
  font-family: var(--font-mono); font-size: 22px;
  letter-spacing: 0.32em; text-transform: uppercase;
  color: #FFFFFF; font-weight: 500;
}
.p-section-lava .sl-mark img { height: 28px; filter: brightness(0) invert(1); opacity: 0.9; }
.p-section-lava .sl-body {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  gap: 80px; min-height: 0;
}
.p-section-lava .sl-body h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: var(--t-display);
  line-height: 0.94;
  letter-spacing: -0.04em;
  font-weight: 500;
  color: #FFFFFF;
  text-wrap: balance;
  max-width: 1500px;
}
.p-section-lava .sl-body h2 .quiet { color: rgba(255,255,255,0.6); }
.p-section-lava .sl-body h2 em {
  font-style: italic; font-weight: 500; color: var(--navy-900);
  /* italic accent: deep navy on lava for max contrast */
}
.p-section-lava .sl-numeral {
  font-family: var(--font-display);
  font-size: 540px;
  line-height: 0.78;
  letter-spacing: -0.06em;
  font-weight: 500;
  color: rgba(255,255,255,0.10);
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.p-section-lava .sl-foot {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.24);
  font-family: var(--font-mono); font-size: 21px;
  letter-spacing: 0.06em; color: rgba(255,255,255,0.85);
}
.p-section-lava .sl-foot b {
  display: block;
  font-family: var(--font-sans);
  font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.6); font-weight: 500;
  margin-bottom: 6px;
}

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — manifesto-darkroom
   ────────────────────────────────────────────────────────────────────────── */
.p-manifesto .body {
  padding: 80px var(--margin-l);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 32px;
}
.p-manifesto .mn-top {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
}
.p-manifesto .mn-eyebrow {
  font-family: var(--font-mono); font-size: 22px;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  display: inline-flex; align-items: center; gap: 16px;
}
.p-manifesto .mn-eyebrow::before {
  content: ""; width: 64px; height: 1.5px; background: var(--lava);
}
.p-manifesto .mn-tag {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-300);
}
.p-manifesto .mn-statement {
  align-self: center;
  position: relative;
  max-width: 1500px;
}
.p-manifesto .mn-statement::before {
  content: "“";
  position: absolute;
  top: -120px; left: -32px;
  font-family: var(--font-display);
  font-size: 320px; line-height: 1;
  color: var(--lava);
  font-weight: 500;
  opacity: 0.95;
  font-style: italic;
}
.p-manifesto .mn-statement p {
  margin: 0;
  font-family: var(--font-display);
  font-size: 108px;
  line-height: 1.05;
  letter-spacing: -0.03em;
  font-weight: 500;
  color: #FFFFFF;
  text-wrap: balance;
}
.p-manifesto .mn-statement p .e {
  font-style: italic;
  color: var(--lava);
}
.p-manifesto .mn-attrib {
  display: grid; grid-template-columns: 1fr auto auto; gap: 80px;
  align-items: center;
  padding-top: 28px;
  border-top: 1px solid var(--navy-700);
}
.p-manifesto .mn-attrib .who {
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  color: #F2F5F3;
}
.p-manifesto .mn-attrib .who .role {
  display: block;
  font-size: 22px; font-weight: 400;
  color: var(--navy-300);
  letter-spacing: 0.04em;
  margin-top: 4px;
}
.p-manifesto .mn-attrib .src {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-300); text-align: right;
}

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — quote-portrait
   ────────────────────────────────────────────────────────────────────────── */
.p-quote-p .body {
  padding: 80px var(--margin) 32px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 36px;
}
.p-quote-p .qp-top {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center;
}
.p-quote-p .qp-main {
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 64px;
  min-height: 0;
  align-items: stretch;
}
.p-quote-p .qp-portrait {
  align-self: stretch;
  background: var(--oat-medium);
  border: 1px solid var(--oat-dark);
  border-radius: 4px;
  overflow: hidden;
  position: relative;
  min-height: 480px;
}
.p-quote-p .qp-portrait image-slot {
  display: block;
  width: 100%;
  height: 100%;
}
.p-quote-p .qp-pcap {
  position: absolute;
  left: 16px; right: 16px; bottom: 16px;
  font-family: var(--font-mono); font-size: 14px;

}
.p-sdk .sk-copy .product::before {

}
.p-sdk .sk-copy h2 {

.p-sdk .sk-copy p {

.p-sdk .sk-copy .annotations {

.p-sdk .sk-copy .annotations li {

}
.p-sdk .sk-copy .annotations .n {
  width: 24px; height: 24px;
  background: var(--lava); color: #fff;
  border-radius: 999px;

  font-weight: 500;
}
.p-sdk .sk-copy .annotations .lbl {

}
.p-sdk .sk-copy .annotations h3 {
  margin: 0;
  font-family: var(--font-display); font-size: 21px;
  font-weight: 500; color: var(--navy-900);
  letter-spacing: -0.01em; line-height: 1.2;
}
.p-sdk .sk-copy .annotations p {
  margin: 2px 0 0;
  font-family: var(--font-display); font-size: 22px;
  line-height: 1.45; color: var(--navy-700);
}
.p-sdk .sk-copy .install {
  margin-top: auto; padding: 12px 14px;
  background: var(--navy-900); color: #FFFFFF;
  border-radius: 4px;
  font-family: var(--font-mono); font-size: 21px;
  letter-spacing: 0;
  display: grid; grid-template-columns: auto 1fr; gap: 12px;
  align-items: center;
}
.p-sdk .sk-copy .install b {
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
}
.p-sdk .sk-code {
  background: var(--navy-900); color: #E4EAE7;
  border-radius: 6px;
  overflow: hidden;
  display: grid; grid-template-rows: auto 1fr auto;
  min-height: 0;
}
.p-sdk .sk-code .head {
  display: grid; grid-template-columns: 1fr auto; align-items: center;
  padding: 12px 18px;
  background: #04161B;
  border-bottom: 1px solid var(--navy-700);
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-300); letter-spacing: 0.14em;
  text-transform: uppercase;
}
.p-sdk .sk-code .head .file {
  color: #FFFFFF; font-family: var(--font-mono);
  text-transform: none; letter-spacing: 0;
  font-size: 14px;
}
.p-sdk .sk-code .head .file::before { content: "● "; color: var(--lava); }
.p-sdk .sk-code pre {
  margin: 0;
  padding: 22px 26px;
  font-family: var(--font-mono);
  font-size: 15px;
  line-height: 1.65;
  color: #E4EAE7;
  white-space: pre;
  overflow: hidden;
  position: relative;
  counter-reset: ln;
}
.p-sdk .sk-code pre .ln {
  display: block;
  position: relative;
  counter-increment: ln;
  min-height: 1em;
}
.p-sdk .sk-code pre .ln::before {
  content: counter(ln, decimal-leading-zero);
  position: absolute;
  left: -52px;
  font-family: var(--font-mono); font-size: 13px;
  color: var(--navy-500);
  letter-spacing: 0.04em;
  width: 28px; text-align: right;
}
.p-sdk .sk-code pre { padding-left: 70px; }
.p-sdk .sk-code pre .c { color: var(--navy-300); font-style: italic; }
.p-sdk .sk-code pre .k { color: #FFB8AD; }
.p-sdk .sk-code pre .s { color: #7CD1B1; }
.p-sdk .sk-code pre .v { color: #9AC7FF; }
.p-sdk .sk-code pre .n { color: #FFC38A; }
.p-sdk .sk-code pre .hl {
  background: rgba(255,54,33,0.18);
  display: block;
  margin: 0 -26px 0 -70px;
  padding: 0 26px 0 70px;
  position: relative;
}
.p-sdk .sk-code pre .pin {
  position: absolute;
  right: 14px; top: 50%; transform: translateY(-50%);
  width: 22px; height: 22px;
  background: var(--lava); color: #fff;
  border-radius: 999px;
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 14px;
  font-weight: 500;
}
.p-sdk .sk-code .foot {
  display: grid; grid-template-columns: 1fr auto;
  gap: 16px; align-items: center;
  padding: 12px 18px;
  background: #04161B;
  border-top: 1px solid var(--navy-700);
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-300); letter-spacing: 0.08em;
}
.p-sdk .sk-code .foot b {
  color: var(--mint); font-weight: 500;
}

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — pipeline-dag (horizontal Bronze→Silver→Gold pipeline)
   ────────────────────────────────────────────────────────────────────────── */
.p-pipeline .body {
  padding: 80px var(--margin) 32px;
  display: grid; grid-template-rows: auto 1fr auto;
  gap: 32px;
}
.p-pipeline .pp-head {
  display: grid; grid-template-columns: 1fr auto; align-items: end;
  padding-bottom: 18px;
  border-bottom: 1.5px solid var(--navy-900);
}
.p-pipeline .pp-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 56px;
  line-height: 1; letter-spacing: -0.025em; font-weight: 500;
}
.p-pipeline .pp-head h2 em { font-style: italic; color: var(--lava); font-weight: 500; }
.p-pipeline .pp-head .meta {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); text-align: right; line-height: 1.6;
}
.p-pipeline .dag {
  display: grid;
  grid-template-columns: 1.05fr 28px 1fr 28px 1fr 28px 1fr;

  min-height: 0;
}
.p-pipeline .stage {
  background: #FFFFFF;
  border: 1px solid var(--oat-dark);
  border-radius: 6px;
  padding: 22px 22px 18px;
  display: flex; flex-direction: column; gap: 12px;

}
.p-pipeline .stage.gold { border-color: var(--lava); border-width: 2px; padding: 21px 21px 17px; }
.p-pipeline .stage.gold::after {
  content: "Salida";
  position: absolute; top: -10px; right: 16px;
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: #fff; background: var(--lava);
  padding: 4px 10px; border-radius: 999px; font-weight: 500;
}
.p-pipeline .stage .tag {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
}
.p-pipeline .stage.bronze .tag { color: #8C5A36; }
.p-pipeline .stage.silver .tag { color: #5B7079; }
.p-pipeline .stage.gold .tag   { color: var(--lava); }
.p-pipeline .stage.source .tag { color: var(--azure); }
.p-pipeline .stage .nm {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500; color: var(--navy-900);
  letter-spacing: -0.015em; line-height: 1.1;
}
.p-pipeline .stage .role {
  font-family: var(--font-display); font-size: 22px;
  color: var(--navy-700); line-height: 1.4;
}
.p-pipeline .stage .tech {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-500); letter-spacing: 0.04em;
  padding-top: 10px;
  border-top: 1px dashed var(--oat-dark);
  display: flex; flex-wrap: wrap; gap: 4px 10px;
}
.p-pipeline .stage .tech b {
  color: var(--navy-900); font-weight: 500;
}
.p-pipeline .stage .metrics {
  margin-top: auto;
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px;
  padding-top: 10px;
  border-top: 1px solid var(--oat-dark);
}
.p-pipeline .stage .metrics .m dt {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); font-weight: 500;
  margin-bottom: 2px;
}
.p-pipeline .stage .metrics .m dd {
  margin: 0;
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500; color: var(--navy-900);
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.p-pipeline .stage.gold .metrics .m dd { color: var(--lava); }
.p-pipeline .arrow {
  align-self: center; justify-self: center;
  font-family: var(--font-display);
  font-size: 32px; line-height: 1;
  color: var(--navy-300); font-weight: 500;
  position: relative;
}
.p-pipeline .arrow::before {
  content: ""; position: absolute;
  left: -8px; right: -8px; top: 50%; height: 1px;
  background: var(--oat-dark);
  z-index: -1;
}
.p-pipeline .pp-foot {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding-top: 16px;
  border-top: 1.5px solid var(--navy-900);
}
.p-pipeline .pp-foot .item {
  display: flex; flex-direction: column; gap: 4px;
}
.p-pipeline .pp-foot .item dt {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); font-weight: 500;
}
.p-pipeline .pp-foot .item dd {
  margin: 0;
  font-family: var(--font-display); font-size: 21px;
  color: var(--navy-900); font-weight: 500;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
}
.p-pipeline .pp-foot .item dd .lv { color: var(--lava); }

/* ──────────────────────────────────────────────────────────────────────────
   PATTERN — schema-model (table cards with FK relationships)
   ────────────────────────────────────────────────────────────────────────── */
.p-schema .body {
  padding: 80px var(--margin) 32px;
  display: grid; grid-template-rows: auto 1fr auto;
  gap: 28px;
}
.p-schema .sc-head {
  display: grid; grid-template-columns: 1fr auto; align-items: end;
  padding-bottom: 18px;
  border-bottom: 1.5px solid var(--navy-900);
}
.p-schema .sc-head h2 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 56px;
  line-height: 1; letter-spacing: -0.025em; font-weight: 500;
}
.p-schema .sc-head h2 em { font-style: italic; color: var(--lava); font-weight: 500; }
.p-schema .sc-head .meta {
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-500); text-align: right; line-height: 1.6;
}
.p-schema .sc-grid {
  display: grid;

}
.p-schema .sc-grid .erd-links {
  position: absolute;
  top: 0;
  left: 0;

  pointer-events: none;
  overflow: visible;
  z-index: 2;
}
.p-schema .sc-grid .erd-links path {
  fill: none;
  stroke: var(--lava);
  stroke-width: 2;
  stroke-linecap: round;
}
.p-schema .sc-grid .erd-links circle {
  fill: var(--oat-light);
  stroke: var(--lava);
  stroke-width: 2;
}
.p-schema .sc-grid .erd-links text {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  fill: var(--lava);
  font-weight: 500;
}
.p-schema .sc-grid .erd-links .lbl-bg {
  fill: var(--oat-light);
}
/* Legacy .link rules — disabled, kept dormant in case markup remains */
.p-schema .sc-grid .link { display: none; }
.p-schema .tbl {
  background: #FFFFFF;
  border: 1px solid var(--oat-dark);
  border-radius: 6px;
  overflow: hidden;
  display: grid; grid-template-rows: auto 1fr;
  font-family: var(--font-mono);
  box-shadow: 0 8px 24px rgba(11,32,38,0.06);
  margin: 0 24px;
  align-self: start;
}
.p-schema .tbl.center { /* keeps fact table at same Y as dim tables for clean line routing */ }
.p-schema .tbl .th {
  display: grid; grid-template-columns: 1fr auto;
  gap: 8px; align-items: center;
  padding: 12px 16px;
  background: var(--navy-900); color: #FFFFFF;
  font-family: var(--font-display);
  font-size: 22px; font-weight: 500;
  letter-spacing: -0.01em;
}
.p-schema .tbl .th .nm::before {
  content: "▦ "; color: var(--lava);
}
.p-schema .tbl .th .ct {
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--navy-300); font-weight: 500;
}
.p-schema .tbl.fact .th { background: var(--lava); }
.p-schema .tbl.fact .th .nm::before { color: #FFFFFF; }
.p-schema .tbl.fact .th .ct { color: rgba(255,255,255,0.85); }
.p-schema .tbl .row {
  display: grid;
  grid-template-columns: 24px 1fr auto;
  gap: 10px; align-items: center;
  padding: 7px 16px;
  border-bottom: 1px solid var(--oat-medium);
  font-size: 14px;
  color: var(--navy-700);
}
.p-schema .tbl .row:last-child { border-bottom: 0; }
.p-schema .tbl .row .key {
  font-family: var(--font-mono); font-size: 9px;
  letter-spacing: 0.08em;
  color: var(--lava); font-weight: 500;
  text-align: right;
}
.p-schema .tbl .row .key.fk { color: var(--azure); }
.p-schema .tbl .row .key.idx { color: var(--mint); }
.p-schema .tbl .row .col {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-900); font-weight: 500;
  letter-spacing: 0;
}
.p-schema .tbl .row.pkey .col { color: var(--lava); }
.p-schema .tbl .row .ty {
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-500);
  text-align: right;
}
.p-schema .sc-grid .link {
  position: absolute;
  height: 2px;
  background: var(--lava);
  z-index: 1;
}
.p-schema .sc-grid .link.l { top: 38%; left: 28%; width: 14%; }
.p-schema .sc-grid .link.r { top: 38%; left: 58%; width: 14%; }
.p-schema .sc-grid .link .lbl {
  position: absolute;
  left: 50%; top: -22px;
  transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 13px;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--lava); font-weight: 500;
  background: var(--oat-light);
  padding: 2px 8px; border-radius: 2px;
  white-space: nowrap;
}
.p-schema .sc-grid .link::before,
.p-schema .sc-grid .link::after {
  content: ""; position: absolute; top: -4px;
  width: 10px; height: 10px;
  border: 2px solid var(--lava);
  border-radius: 999px;
  background: var(--oat-light);
}
.p-schema .sc-grid .link::before { left: -5px; }
.p-schema .sc-grid .link::after  { right: -5px; }
.p-schema .sc-foot {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding-top: 16px;
  border-top: 1px solid var(--oat-dark);
  font-family: var(--font-mono); font-size: 14px;
  color: var(--navy-700); letter-spacing: 0.04em;
}
.p-schema .sc-foot .lg { display: inline-flex; align-items: center; gap: 8px; }
.p-schema .sc-foot .lg .k {
  font-weight: 500;
  letter-spacing: 0.14em;
}
.p-schema .sc-foot .lg .k.pk { color: var(--lava); }
.p-schema .sc-foot .lg .k.fk { color: var(--azure); }
.p-schema .sc-foot .lg .k.idx { color: var(--mint); }
.p-schema .sc-foot .lg .k.nn { color: var(--navy-700); }

/* ──────────────────────────────────────────────────────────────────────────
   DENSITY — driven by Tweaks
   ────────────────────────────────────────────────────────────────────────── */
:root[data-density="compact"] { --margin: 72px;  --margin-l: 96px;  --gutter: 20px; }
:root[data-density="comfy"]   { --margin: 120px; --margin-l: 160px; --gutter: 28px; }

/* ──────────────────────────────────────────────────────────────────────────
   MOTION — driven by Tweaks
   When [data-motion="on"], slide content fades + rises on enter.
   ────────────────────────────────────────────────────────────────────────── */
@keyframes fadeUp {
  0%   { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  0%   { opacity: 0; transform: scale(0.96); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes drawSpark {
  0%   { stroke-dashoffset: 600; }
  100% { stroke-dashoffset: 0; }
}
@keyframes drift {
  0%   { transform: translate(80px, 40px) rotate(8deg); }
  50%  { transform: translate(72px, 32px) rotate(10deg); }
  100% { transform: translate(80px, 40px) rotate(8deg); }
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 6px rgba(255,54,33,0.16); }
  50%      { box-shadow: 0 0 0 14px rgba(255,54,33,0.04); }
}

/* Animations only fire when motion is on, and only on the currently-active
   slide (deck-stage assigns aria-hidden="false" to the visible slide). */
:root[data-motion="on"] .slide[aria-hidden="false"] .slide-title,
:root[data-motion="on"] .slide[aria-hidden="false"] .lede,
:root[data-motion="on"] .slide[aria-hidden="false"] .eyebrow,
:root[data-motion="on"] .slide[aria-hidden="false"] .mn-statement,
:root[data-motion="on"] .slide[aria-hidden="false"] .cv-headline,
:root[data-motion="on"] .slide[aria-hidden="false"] .hm-main,
:root[data-motion="on"] .slide[aria-hidden="false"] .qp-main,
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > *,
:root[data-motion="on"] .slide[aria-hidden="false"] .stack > *,
:root[data-motion="on"] .slide[aria-hidden="false"] .dag > *,
:root[data-motion="on"] .slide[aria-hidden="false"] .sc-grid > .tbl,
:root[data-motion="on"] .slide[aria-hidden="false"] table.bm tbody tr,
:root[data-motion="on"] .slide[aria-hidden="false"] table.mx tbody tr,
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row,
:root[data-motion="on"] .slide[aria-hidden="false"] .rm-track .q,
:root[data-motion="on"] .slide[aria-hidden="false"] .lw-cell,
:root[data-motion="on"] .slide[aria-hidden="false"] .dv-video {
  animation: fadeUp 0.6s var(--ease) both;
}
/* Stagger groups so they cascade in, not all at once. */
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(1) { animation-delay: 0.05s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(2) { animation-delay: 0.10s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(3) { animation-delay: 0.15s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(4) { animation-delay: 0.20s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(5) { animation-delay: 0.25s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .mg-grid > .kpi:nth-child(6) { animation-delay: 0.30s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .stack > *:nth-child(2) { animation-delay: 0.08s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .stack > *:nth-child(3) { animation-delay: 0.16s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .stack > *:nth-child(4) { animation-delay: 0.24s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .stack > *:nth-child(5) { animation-delay: 0.32s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .dag > *:nth-child(odd) { animation-delay: 0.08s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .dag > *:nth-child(3) { animation-delay: 0.16s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .dag > *:nth-child(5) { animation-delay: 0.24s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .dag > *:nth-child(7) { animation-delay: 0.32s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+2) { animation-delay: 0.06s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+3) { animation-delay: 0.12s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+4) { animation-delay: 0.18s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+5) { animation-delay: 0.24s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+6) { animation-delay: 0.30s; }
:root[data-motion="on"] .slide[aria-hidden="false"] .ranked .row:nth-child(n+7) { animation-delay: 0.36s; }

/* Continuous accents — cover ornament gently drifts, "now" pin pulses. */
:root[data-motion="on"] .slide[aria-hidden="false"] .cv-mark img {
  animation: drift 12s ease-in-out infinite;
}
:root[data-motion="on"] .slide[aria-hidden="false"] .q.now .pin {
  animation: pulse 2.4s ease-in-out infinite;
}
:root[data-motion="on"] .slide[aria-hidden="false"] .hm-spark svg path {
  stroke-dasharray: 600;
  animation: drawSpark 1.6s ease-out 0.3s both;
}
:root[data-motion="on"] .slide[aria-hidden="false"] .hm-num {
  animation: scaleIn 0.8s var(--ease) both;
}
